<svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#16294a" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="78%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="280" rx="10" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="10" fill="url(#grid)" opacity="0.55"/>

  <!-- moving scanline -->
  <rect x="0" y="0" width="1000" height="2" fill="#00e5ff" opacity="0.16">
    <animate attributeName="y" values="-4;284" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#00e5ff" stroke-width="2" fill="none" filter="url(#glow)" opacity="0.9">
    <path d="M24 62 L24 24 L62 24"/>
    <path d="M938 24 L976 24 L976 62"/>
    <path d="M24 218 L24 256 L62 256"/>
    <path d="M938 256 L976 256 L976 218"/>
  </g>

  <!-- online status -->
  <g transform="translate(792,46)">
    <circle cx="0" cy="-4" r="5" fill="#39d98a">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" font-size="13" letter-spacing="2" fill="#39d98a">SYSTEM ONLINE</text>
  </g>

  <!-- equalizer bars -->
  <g fill="#00e5ff" opacity="0.85">
    <rect x="864" y="150" width="8" height="20" rx="2"><animate attributeName="height" values="14;46;20;38;14" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="156;124;150;132;156" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="882" y="140" width="8" height="40" rx="2" fill="#ff2d95"><animate attributeName="height" values="40;16;52;24;40" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="130;154;118;146;130" dur="1.7s" repeatCount="indefinite"/></rect>
    <rect x="900" y="148" width="8" height="24" rx="2"><animate attributeName="height" values="24;48;18;42;24" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="146;122;152;128;146" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="918" y="138" width="8" height="44" rx="2" fill="#ff2d95"><animate attributeName="height" values="44;20;50;16;44" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="128;152;120;156;128" dur="1.9s" repeatCount="indefinite"/></rect>
    <rect x="936" y="150" width="8" height="20" rx="2"><animate attributeName="height" values="18;42;26;48;18" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="152;130;146;124;152" dur="1.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- glitch title -->
  <g filter="url(#glow)">
    <text x="60" y="138" font-size="60" font-weight="700" fill="#ff2d95" opacity="0.75">sudarshanj20
      <animate attributeName="x" values="60;56;63;60;60" keyTimes="0;0.1;0.2;0.3;1" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="138" font-size="60" font-weight="700" fill="#00e5ff" opacity="0.75">sudarshanj20
      <animate attributeName="x" values="60;64;57;60;60" keyTimes="0;0.1;0.2;0.3;1" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="138" font-size="60" font-weight="700" fill="#eaf6ff">sudarshanj20</text>
  </g>

  <!-- subtitle with blinking cursor -->
  <text x="62" y="178" font-size="18" letter-spacing="3" fill="#7fdfff">&gt; AI &#183; ML ENGINEER &#183; RL &#183; RAG SYSTEMS<tspan fill="#00e5ff">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- tag chips -->
  <g font-size="12" letter-spacing="1.5">
    <g transform="translate(60,202)"><rect width="138" height="26" rx="13" fill="none" stroke="#00e5ff" stroke-opacity="0.6"/><text x="69" y="17" text-anchor="middle" fill="#9fe9ff">UNC CHARLOTTE</text></g>
    <g transform="translate(212,202)"><rect width="132" height="26" rx="13" fill="none" stroke="#ff2d95" stroke-opacity="0.6"/><text x="66" y="17" text-anchor="middle" fill="#ffa8d2">AWS CERTIFIED</text></g>
    <g transform="translate(358,202)"><rect width="118" height="26" rx="13" fill="none" stroke="#39d98a" stroke-opacity="0.6"/><text x="59" y="17" text-anchor="middle" fill="#8df0c2">IEEE AUTHOR</text></g>
  </g>

  <rect width="1000" height="280" rx="10" fill="url(#vig)"/>
</svg>

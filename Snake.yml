# .github/workflows/snake.yml
# One-time setup for the contribution snake in your README.
# Place this file at:  .github/workflows/snake.yml  in the sudarshanj20/sudarshanj20 repo.
# It auto-runs every 12h and on manual trigger, committing the snake to an "output" branch.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: sudarshanj20
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#0a0f1d,#16294a,#2a6f8f,#00b4d8,#00e5ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

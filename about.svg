<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
  <defs>
    <filter id="g2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="478" height="298" rx="12" fill="#0a0f1d" stroke="#16294a"/>
  <!-- title bar -->
  <rect x="1" y="1" width="478" height="34" rx="12" fill="#0d1426"/>
  <rect x="1" y="22" width="478" height="13" fill="#0d1426"/>
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <text x="240" y="22" text-anchor="middle" font-size="12" fill="#5a6b8c">~/sudarshanj20 — zsh</text>

  <!-- lines, staggered reveal -->
  <g font-size="13.5">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.25s" fill="freeze"/>
      <text x="22" y="72" fill="#00e5ff">$ <tspan fill="#dbe8ff">whoami</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.25s" fill="freeze"/>
      <text x="22" y="94" fill="#39d98a">&#8627; MS CS @ UNC Charlotte &#183; AI / ML</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.25s" fill="freeze"/>
      <text x="22" y="124" fill="#00e5ff">$ <tspan fill="#dbe8ff">cat focus.md</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.25s" fill="freeze"/>
      <text x="22" y="146" fill="#39d98a">&#8627; RL adaptive scheduling + RLHF grading</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.2s" dur="0.25s" fill="freeze"/>
      <text x="22" y="176" fill="#00e5ff">$ <tspan fill="#dbe8ff">ls ./toolbelt</tspan></text></g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.7s" dur="0.25s" fill="freeze"/>
      <text x="22" y="198" fill="#7fdfff">langchain  langgraph  bedrock  pytorch</text></g>

    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.2s" dur="0.25s" fill="freeze"/>
      <text x="22" y="228" fill="#00e5ff">$ <tspan fill="#dbe8ff">status --hire</tspan></text></g>
    <g opacity="0" filter="url(#g2)"><animate attributeName="opacity" to="1" begin="3.7s" dur="0.3s" fill="freeze"/>
      <rect x="22" y="244" width="252" height="28" rx="6" fill="none" stroke="#ff2d95"/>
      <text x="148" y="263" text-anchor="middle" font-size="13" letter-spacing="1" fill="#ff8ac4">OPEN TO AI ENGINEER ROLES</text></g>

    <rect x="288" y="248" width="9" height="18" fill="#00e5ff" opacity="0">
      <animate attributeName="opacity" to="1" begin="4s" dur="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" begin="4.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

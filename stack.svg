<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Courier New',monospace">
  <rect x="1" y="1" width="478" height="298" rx="12" fill="#0a0f1d" stroke="#16294a"/>

  <text x="22" y="34" font-size="14" letter-spacing="2" fill="#5a6b8c">// STACK.modules</text>
  <line x1="22" y1="44" x2="458" y2="44" stroke="#16294a"/>

  <!-- helper: each chip = rect + text, staggered fade-in -->
  <g font-size="13">
    <!-- LANGUAGES -->
    <text x="22" y="72" font-size="11" letter-spacing="2" fill="#00e5ff">LANGUAGES</text>
    <g fill="none" stroke="#00e5ff" stroke-opacity="0.55">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.3s" fill="freeze"/><rect x="22" y="80" width="70" height="26" rx="6"/><text x="57" y="97" text-anchor="middle" fill="#cfe9ff" stroke="none">Python</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.32s" dur="0.3s" fill="freeze"/><rect x="100" y="80" width="50" height="26" rx="6"/><text x="125" y="97" text-anchor="middle" fill="#cfe9ff" stroke="none">JS</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.44s" dur="0.3s" fill="freeze"/><rect x="158" y="80" width="54" height="26" rx="6"/><text x="185" y="97" text-anchor="middle" fill="#cfe9ff" stroke="none">SQL</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.56s" dur="0.3s" fill="freeze"/><rect x="220" y="80" width="52" height="26" rx="6"/><text x="246" y="97" text-anchor="middle" fill="#cfe9ff" stroke="none">PHP</text></g>
    </g>

    <!-- ML / AI -->
    <text x="22" y="132" font-size="11" letter-spacing="2" fill="#ff2d95">ML / AI</text>
    <g fill="none" stroke="#ff2d95" stroke-opacity="0.55">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.3s" fill="freeze"/><rect x="22" y="140" width="78" height="26" rx="6"/><text x="61" y="157" text-anchor="middle" fill="#ffd0e6" stroke="none">PyTorch</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.82s" dur="0.3s" fill="freeze"/><rect x="108" y="140" width="96" height="26" rx="6"/><text x="156" y="157" text-anchor="middle" fill="#ffd0e6" stroke="none">LangChain</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="0.94s" dur="0.3s" fill="freeze"/><rect x="212" y="140" width="100" height="26" rx="6"/><text x="262" y="157" text-anchor="middle" fill="#ffd0e6" stroke="none">LangGraph</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.06s" dur="0.3s" fill="freeze"/><rect x="320" y="140" width="108" height="26" rx="6"/><text x="374" y="157" text-anchor="middle" fill="#ffd0e6" stroke="none">Gymnasium</text></g>
    </g>

    <!-- CLOUD / DATA -->
    <text x="22" y="192" font-size="11" letter-spacing="2" fill="#39d98a">CLOUD / DATA</text>
    <g fill="none" stroke="#39d98a" stroke-opacity="0.55">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.3s" fill="freeze"/><rect x="22" y="200" width="56" height="26" rx="6"/><text x="50" y="217" text-anchor="middle" fill="#bff3da" stroke="none">AWS</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.32s" dur="0.3s" fill="freeze"/><rect x="86" y="200" width="70" height="26" rx="6"/><text x="121" y="217" text-anchor="middle" fill="#bff3da" stroke="none">Docker</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.44s" dur="0.3s" fill="freeze"/><rect x="164" y="200" width="78" height="26" rx="6"/><text x="203" y="217" text-anchor="middle" fill="#bff3da" stroke="none">Bedrock</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.56s" dur="0.3s" fill="freeze"/><rect x="250" y="200" width="58" height="26" rx="6"/><text x="279" y="217" text-anchor="middle" fill="#bff3da" stroke="none">Spark</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.68s" dur="0.3s" fill="freeze"/><rect x="316" y="200" width="74" height="26" rx="6"/><text x="353" y="217" text-anchor="middle" fill="#bff3da" stroke="none">MongoDB</text></g>
    </g>

    <!-- WEB -->
    <text x="22" y="252" font-size="11" letter-spacing="2" fill="#7fdfff">WEB</text>
    <g fill="none" stroke="#7fdfff" stroke-opacity="0.55">
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.82s" dur="0.3s" fill="freeze"/><rect x="22" y="260" width="64" height="26" rx="6"/><text x="54" y="277" text-anchor="middle" fill="#d7f4ff" stroke="none">React</text></g>
      <g opacity="0"><animate attributeName="opacity" to="1" begin="1.94s" dur="0.3s" fill="freeze"/><rect x="94" y="260" width="78" height="26" rx="6"/><text x="133" y="277" text-anchor="middle" fill="#d7f4ff" stroke="none">Node.js</text></g>
    </g>
  </g>
</svg>
